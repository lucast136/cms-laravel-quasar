name: Pipeline Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend (Laravel 13 / PHP 8.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, gd, intl, zip, bcmath, exif, pcntl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend-cms/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend-cms/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Laravel Pint)
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Prepare environment and run tests
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --force
          php artisan test

  frontend-ci:
    name: Frontend (Quasar SSR / Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-cms/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npx quasar prepare --silent

      - name: Check lint and formatting (ESLint + Prettier)
        run: npm run lint:check

      - name: Verify Quasar SSR build
        run: npm run build

  deploy-prod:
    name: Build & Deploy Production
    needs: [backend-ci, frontend-ci]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository & image names
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${REPO_LOWER}-backend:prod-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO_LOWER}-frontend:prod-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image (Prod)
        uses: docker/build-push-action@v6
        with:
          context: ./backend-cms
          file: ./backend-cms/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:prod-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:prod-latest
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build and push Frontend SSR image (Prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-cms
          file: ./frontend-cms/Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:prod-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:prod-latest
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      - name: Copy docker-compose.deploy.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.deploy.yml"
          target: "${{ secrets.DEPLOY_PATH || '/home/aplications/production/cms-deperumaster' }}"

      - name: Deploy containers via SSH (Prod)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/home/aplications/production/cms-deperumaster' }}"
            [ -f backend-cms/.env ] || cp backend-cms/.env.example backend-cms/.env
            if ! grep -qE "^APP_KEY=base64:.+" backend-cms/.env; then
              NEW_KEY="base64:$(openssl rand -base64 32)"
              if grep -q "^APP_KEY=" backend-cms/.env; then
                sed -i "s|^APP_KEY=.*|APP_KEY=${NEW_KEY}|" backend-cms/.env
              else
                echo "APP_KEY=${NEW_KEY}" >> backend-cms/.env
              fi
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export DEPLOY_ENV="prod"
            export COMPOSE_PROJECT_NAME="cms-deperumaster-prod"
            export BACKEND_IMAGE="${{ steps.meta.outputs.backend_image }}"
            export FRONTEND_IMAGE="${{ steps.meta.outputs.frontend_image }}"
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f

