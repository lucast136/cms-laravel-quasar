name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  backend-ci:
    name: Backend (Laravel 13 / PHP 8.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, gd, intl, zip, bcmath, exif, pcntl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend-cms/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend-cms/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Laravel Pint)
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Prepare environment and run tests
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --force
          php artisan test

  frontend-ci:
    name: Frontend (Quasar SSR / Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-cms/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npx quasar prepare --silent

      - name: Check lint and formatting (ESLint + Prettier)
        run: npm run lint:check

      - name: Verify Quasar SSR build
        run: npm run build

