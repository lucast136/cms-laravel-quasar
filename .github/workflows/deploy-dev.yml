name: Deploy Development

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images (Dev)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set lowercase repository & image names
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${REPO_LOWER}-backend:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO_LOWER}-frontend:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-cms
          file: ./backend-cms/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:dev-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:dev-latest
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Build and push Frontend SSR image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-cms
          file: ./frontend-cms/Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000/api/v1' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:dev-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:dev-latest
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev

  deploy-cloud:
    name: Auto-Deploy to Cloud Server (Dev)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copy docker-compose.deploy.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.deploy.yml"
          target: "${{ secrets.DEPLOY_PATH || '/home/aplications/development/cms-deperumaster' }}"

      - name: Deploy containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/home/aplications/development/cms-deperumaster' }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend_image }}"
            export FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend_image }}"
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker compose -f docker-compose.deploy.yml exec -T backend php artisan migrate --force
            docker image prune -f

